# Meta Omnilingual ASR (omniASR, Apache-2.0) for the ASR eval and the developer compare mode only
# (2026-10-14, Part 12; docs/status/asr-omni-eval-2026-10-14.md). Never on the production route.
# Same API as risime-whisper (/v1/audio/transcriptions, /v1/audio/compare), Bearer WHISPER_API_KEY.
# Binds 127.0.0.1:8210 only (rule 6); no Caddy route. Models load on first use, one at a time, and
# unload when idle, because the GB10's unified memory is shared with risi-l1 and risime-whisper.
#   docker compose --env-file .env -f infra/docker-compose.omniasr.yml up -d --build
# Compare mode picks it up when the app server has RISI_SPEECH_COMPARE_EXTRA_URL=http://127.0.0.1:8210
# (models: RISI_SPEECH_COMPARE_EXTRA_MODELS, default omniasr-llm-1b).
# Checkpoints: ~/risime-eval-models/omniASR-*/ (Hugging Face facebook/omniASR-*), tokenizers in
# ~/risime-eval-models/omniASR-tokenizers/ (outside the repo).
name: risime-omniasr
services:
  omniasr:
    build:
      context: omniasr
    image: risime/omniasr:fs2-0.6.0-oa-0.2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8210:8000"
    gpus: all
    read_only: true
    tmpfs:
      # fairseq2 asset cards (local paths only) and Python caches; never audio.
      - /tmp:size=64m,mode=1777
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Host-side RAM (Python, the data pipeline, page cache of the memory-mapped checkpoint). The
    # model's CUDA memory is unified memory allocated outside this cgroup; the service refuses a
    # load that would take host MemAvailable below OMNI_MIN_AVAILABLE_MB.
    mem_limit: 6g
    environment:
      WHISPER_API_KEY: ${WHISPER_API_KEY:?set in .env}
      OMNI_MODELS_ROOT: /models
      OMNI_MIN_AVAILABLE_MB: ${OMNI_MIN_AVAILABLE_MB:-4096}
      OMNI_IDLE_UNLOAD_S: ${OMNI_IDLE_UNLOAD_S:-180}
      OMNI_COMPARE: ${OMNI_COMPARE:-omniasr-llm-1b}
      # Served with the encoder streamed per request (not resident; slow, compare only).
      OMNI_STREAMED: ${OMNI_STREAMED:-omniasr-llm-7b,omniasr-ctc-7b}
      OMNI_DTYPE: ${OMNI_DTYPE:-bf16}
      HF_HUB_OFFLINE: "1"
      DO_NOT_TRACK: "1"
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${HOME}/risime-eval-models:/models:ro
      # Live speech first (2026-10-14): only the pause file's own directory, read-only.
      - ${HOME}/risime-logs/speech-guard:/guard:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
