modules:
  http_2xx:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
  http_health:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      fail_if_body_not_matches_regexp: ['"status":\s*"ok"']
  http_keycloak_lan:           # the incident: public VIPs stalled while the LAN path did not
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      headers: { Host: risicloud.ai }
      tls_config: { server_name: risicloud.ai }
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp: { preferred_ip_protocol: ip4, ip_protocol_fallback: false }
