global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules/*.yml]
alerting:
  alertmanagers:
    - static_configs: [{ targets: ["127.0.0.1:9093"] }]

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["127.0.0.1:9090"] }]
  - job_name: alertmanager
    static_configs: [{ targets: ["127.0.0.1:9093"] }]
  - job_name: node          # host + textfile (GPU, Cassandra, restarts)
    static_configs: [{ targets: ["127.0.0.1:9100"] }]
  - job_name: postgres
    static_configs: [{ targets: ["127.0.0.1:9187"] }]
  - job_name: loki
    static_configs: [{ targets: ["127.0.0.1:3100"] }]
  - job_name: alloy
    static_configs: [{ targets: ["127.0.0.1:12345"] }]
  - job_name: grafana
    static_configs: [{ targets: ["127.0.0.1:3000"] }]
  - job_name: blackbox_exporter
    static_configs: [{ targets: ["127.0.0.1:9115"] }]
  - job_name: risime_server      # PromEx (server role adds :4021; 404/refused until then)
    metrics_path: /metrics
    static_configs: [{ targets: ["127.0.0.1:4021"] }]
  - job_name: vllm              # read-only scrape of the live model server
    metrics_path: /metrics
    static_configs: [{ targets: ["127.0.0.1:8100"] }]

  # Probes. The "module" is chosen per job; the instance label stays the probed URL / host:port.
  - job_name: probe_http
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets: ["https://risicloud.ai/realms/aoa"]
        labels: { path: public, service: keycloak }
    relabel_configs: &probe_relabel
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "127.0.0.1:9115" }
  - job_name: probe_health      # body must contain "status":"ok"
    metrics_path: /probe
    params: { module: [http_health] }
    static_configs:
      - targets: ["https://risime.risicloud.ai/health"]
        labels: { path: public, service: risime }
      - targets: ["http://127.0.0.1:4000/health"]
        labels: { path: local, service: risime }
    relabel_configs: *probe_relabel
  - job_name: probe_keycloak_lan  # Keycloak over the LAN path (10.20.20.14, SNI/Host risicloud.ai)
    metrics_path: /probe
    params: { module: [http_keycloak_lan] }
    static_configs:
      - targets: ["https://10.20.20.14/realms/aoa"]
        labels: { path: lan, service: keycloak }
    relabel_configs: *probe_relabel
  - job_name: probe_tcp         # TURN (public + LAN), LiveKit signalling (loopback, behind Caddy /livekit)
    metrics_path: /probe
    params: { module: [tcp_connect] }
    static_configs:
      - targets: ["203.115.26.139:3478"]
        labels: { path: public, service: turn }
      - targets: ["10.20.20.15:3478"]
        labels: { path: lan, service: turn }
      - targets: ["127.0.0.1:7880"]
        labels: { path: local, service: livekit }
    relabel_configs: *probe_relabel
