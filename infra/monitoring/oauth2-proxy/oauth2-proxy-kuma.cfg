# Login proxy for the Uptime Kuma admin UI (uptime.risicloud.ai); same Keycloak client "monitor".
# (OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET), never from this file.
http_address = "127.0.0.1:4181"
provider = "keycloak-oidc"
oidc_issuer_url = "https://risicloud.ai/realms/aoa"
client_id = "monitor"
redirect_url = "https://uptime.risicloud.ai/oauth2/callback"
allowed_groups = ["risime-admins"]
oidc_groups_claim = "groups"
email_domains = ["*"]
scope = "openid email profile"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_domains = ["uptime.risicloud.ai"]
whitelist_domains = ["uptime.risicloud.ai"]
reverse_proxy = true
pass_user_headers = true
skip_provider_button = true
code_challenge_method = "S256"
# Grafana at /, the server's Phoenix LiveDashboard at /dashboard/ (loopback-only port 4021).
upstreams = ["http://127.0.0.1:3001/"]
