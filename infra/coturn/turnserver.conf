# coturn for RisiMe voice calls on spark2 (decision 046; contract proposal v1.13).
# This file has NO secret. infra/coturn/entrypoint.sh appends static-auth-secret from
# TURN_SECRET (repo .env, gitignored) into a private copy at start.
#
# PUBLIC by design: an explicit exception to CLAUDE.md rule 6 (decision 046). Exactly these
# ports, on spark2's LAN address (NATed 1:1 from 203.115.26.139):
#   3478/udp+tcp  STUN/TURN
#   5349/tcp      TURN over TLS (only once a certificate is configured below)
#   49152-49499/udp  relay range (348 ports; 49500-49999/udp belong to LiveKit, infra/livekit)
# Nothing else listens: no CLI, no web admin, no Prometheus, no TCP relay.

realm=risime.risicloud.ai
server-name=risime.risicloud.ai

# Interfaces. Never 0.0.0.0: only the LAN address that the public IP maps to.
listening-ip=10.20.20.15
relay-ip=10.20.20.15
external-ip=203.115.26.139/10.20.20.15
listening-port=3478
tls-listening-port=5349
# Relay range shrunk 2026-10-08 from 49152-49999 to 49152-49499: LiveKit's RTC media takes
# 49500-49999 (infra/livekit/livekit.yaml). The two ranges must never overlap.
min-port=49152
max-port=49499
# DTLS on 5349/udp is not opened; TURN/TLS is TCP only.
no-dtls

# Auth: time-limited REST credentials (username "<expiry unix ts>:<opaque id>",
# password = base64(HMAC-SHA1(secret, username))), minted by GET /api/v1/calls/turn.
use-auth-secret
# static-auth-secret=...   <- appended at start from TURN_SECRET; never in this file
fingerprint
stale-nonce=600
no-software-attribute

# TLS (5349). Caddy's certificate for risime.risicloud.ai is in /var/lib/caddy (root-only), so
# this stays off until Harsha gives the coturn container read access to a copy (decision 046).
# cert=/certs/risime.risicloud.ai.crt
# pkey=/certs/risime.risicloud.ai.key
no-tlsv1
no-tlsv1_1
cipher-list="ECDHE+AESGCM:ECDHE+CHACHA20"

# Hardening.
no-cli
no-tcp-relay
no-multicast-peers
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780

# The relay may only reach public unicast addresses: never spark2's LAN, loopback (the pilot on
# :4000, Postgres, Cassandra, Caddy admin), Docker bridges, Tailscale/CGNAT or reserved ranges.
# The public IP 203.115.26.139 itself stays allowed so two relayed clients can reach each other
# (it only exposes what is public anyway).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::-::ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Quotas. Every UDP allocation holds one relay port (WebRTC multiplexes RTP/RTCP and audio/video
# on one 5-tuple, so a call needs no port pairs). A 1:1 call needs at most 2 allocations per user
# (one per side, plus an ICE restart). total-quota=300 keeps ~48 of the 348 relay ports
# (49152-49499) free, so a full quota never makes coturn hunt for a free port; 300 allocations
# are ~150 relayed calls at once, far above the pilot's needs.
user-quota=8
total-quota=300
# Bytes per second per session: 300 KB/s = 2.4 Mbit/s, enough for a 1:1 video call over the relay
# (WebRTC video ~0.3-1.5 Mbit/s at 480p-720p plus Opus) with headroom; voice uses ~64 kbit/s.
# No bps-capacity (server total) is set: the quotas and short credentials bound abuse.
max-bps=300000
# Lifetimes: allocations refresh every 10 min at most; channel/permission defaults.
max-allocate-lifetime=3600

# Logging to stdout (docker logs); no per-packet logs, no credentials.
log-file=stdout
simple-log
