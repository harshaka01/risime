# Self-hosted speech-to-text for Risi call transcription (decisions 070, 071). faster-whisper
# (CTranslate2 built from source with CUDA for the GB10, sm_121) behind an OpenAI-compatible
# POST /v1/audio/transcriptions. Binds 127.0.0.1:8200 only (rule 6); no Caddy route. The only
# client is the app server's risi-listen path. No audio or text leaves spark2: the model is local,
# the hub is offline, audio is decoded in memory and no transcript is logged.
#   docker compose --env-file .env -f infra/docker-compose.whisper.yml up -d --build
# Needs in .env: WHISPER_API_KEY (Bearer token; scripts/whisper-smoke generates it if absent).
# Model: ~/risime-models/faster-whisper-large-v3 (outside the repo), see decision 071.
# Faster option: WHISPER_MODEL_DIR=faster-whisper-large-v3-turbo in .env (alias stays the same
# unless WHISPER_MODEL_ALIAS is set too; the learning log records the alias).
# Extra models (si, ta, compare-only) are prepared once by infra/whisper/convert_models.py into
# ~/risime-models; model=auto routes per chunk by language. Smoke: scripts/asr-smoke.
# Smoke test: scripts/whisper-smoke
name: risime-whisper
services:
  whisper:
    build:
      context: whisper
    image: risime/whisper:ct2-4.8.2-fw-1.2.1-asr5
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8000"
    gpus: all
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      # Triton (torch's native ops, used by the Qwen3-ASR path) compiles a small .so and must
      # dlopen it, so this tmpfs alone allows exec. It holds compiled kernels only, never audio.
      - /cache:size=128m,mode=1777,exec
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Host-side RAM (Python, decoder, buffers). On the GB10 the model's CUDA memory is unified
    # memory that the driver allocates outside this cgroup; it is bounded by the model size and
    # the CTranslate2 cache limit below. Measured numbers: docs/decisions/071-whisper.md.
    # 8g since 2026-10-12: torch + transformers for Qwen3-ASR add ~2 GB anon/shmem, and the
    # page cache of model files read at load counts here too (6g hit the limit with reclaim).
    mem_limit: 8g
    environment:
      WHISPER_API_KEY: ${WHISPER_API_KEY:?set in .env}
      WHISPER_MODEL_PATH: /models/${WHISPER_MODEL_DIR:-faster-whisper-large-v3}
      WHISPER_MODEL_ALIAS: ${WHISPER_MODEL_ALIAS:-faster-whisper-large-v3}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8_float16}
      WHISPER_NUM_WORKERS: ${WHISPER_NUM_WORKERS:-2}
      # Model pool (decision 071 amendment 2026-10-12): lazy loads, LRU unload. A load is refused
      # (model=auto then falls back to large-v3) if the loaded models' estimates would pass the
      # budget or host MemAvailable would drop below the floor, so risi-l1 is never starved.
      WHISPER_MEM_BUDGET_MB: ${WHISPER_MEM_BUDGET_MB:-11000}
      WHISPER_MIN_AVAILABLE_MB: ${WHISPER_MIN_AVAILABLE_MB:-3072}
      QWEN_ASR_BEAMS: ${QWEN_ASR_BEAMS:-1}
      WHISPER_IDLE_UNLOAD_S: ${WHISPER_IDLE_UNLOAD_S:-900}
      # Amendment c (2026-10-12, ASR eval on held-out sets, docs/RISI-MODELS.md): si routes to
      # Qwen3-ASR-0.6B-Sinhala; whisper-small-sinhala stays loaded as its retry/memory fallback.
      # Rollback of the routing alone: WHISPER_ROUTE_SI=whisper-small-sinhala in .env.
      WHISPER_ROUTE_SI: ${WHISPER_ROUTE_SI:-qwen3-asr-0.6b-sinhala}
      WHISPER_ROUTE_TA: ${WHISPER_ROUTE_TA:-tamil-asr-qwen3}
      # Tamil memory fallback before large-v3 (tamil-asr-qwen3 needs ~6.7 GB).
      WHISPER_TA_FALLBACK: ${WHISPER_TA_FALLBACK:-whisper-tamil-medium}
      WHISPER_KEEP: ${WHISPER_KEEP:-whisper-small-sinhala}
      WHISPER_SI_RETRY_ORDER: ${WHISPER_SI_RETRY_ORDER:-whisper-small-sinhala,qwen3-asr-0.6b-sinhala}
      # Language hints (2026-10-13): language_hint on a request (the call's expected languages)
      # steers routing: off (detection only) | prior (hinted si/ta unless en is very likely) |
      # force (hinted si/ta always). docs/RISI-MODELS.md "Routing check and language hints".
      WHISPER_HINT_MODE: ${WHISPER_HINT_MODE:-off}
      WHISPER_HINT_EN_MIN_P: ${WHISPER_HINT_EN_MIN_P:-0.9}
      # Compare mode without a models list: per detected language (routed model first).
      WHISPER_COMPARE_SI: ${WHISPER_COMPARE_SI:-whisper-small-sinhala,omnilingual-ctc-1b}
      WHISPER_COMPARE_TA: ${WHISPER_COMPARE_TA:-whisper-tamil-medium,omnilingual-ctc-1b,faster-whisper-large-v3}
      WHISPER_COMPARE_EN: ${WHISPER_COMPARE_EN:-faster-whisper-large-v3-turbo}
      OMNI_CTC_THREADS: ${OMNI_CTC_THREADS:-8}
      TRITON_CACHE_DIR: /cache/triton
      # cudaMallocAsync returns freed CUDA memory instead of caching it: measured 2.0 GB vs
      # 4.4 GB resident for large-v3 (int8_float16 vs float16 + cub_caching), and no slower.
      # The caching config below applies only if CT2_CUDA_ALLOCATOR=cub_caching is set.
      CT2_CUDA_ALLOCATOR: ${CT2_CUDA_ALLOCATOR:-cuda_malloc_async}
      CT2_CUDA_CACHING_ALLOCATOR_CONFIG: ${CT2_CUDA_CACHING_ALLOCATOR_CONFIG:-4,3,12,1073741824}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DO_NOT_TRACK: "1"
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${HOME}/risime-models:/models:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
