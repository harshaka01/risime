# fail2ban filter for RisiMe auth failures (docs/decisions/023, docs/status/server.md).
# Line format (one per failure; never a phone, email, token or code):
#   2026-10-06T08:15:30Z risime auth_failure ip=203.0.113.9 kind=invalid_code path=/api/v1/auth/verify
# fail2ban's default date detection reads the leading ISO-8601 timestamp and strips it before
# matching, hence the anchor on the remainder. Test: fail2ban-regex <auth.log> <this file>
[Definition]
failregex   = ^\s*risime auth_failure ip=<HOST> kind=\S+
ignoreregex =
