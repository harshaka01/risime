# fail2ban filter for RisiMe open sign-up abuse (contract v1.20 §21.7, decision 058).
# Matches only refused (bad_request, phone_taken, signup_closed) and rate-limited sign-ups:
#   2026-10-08T08:15:30Z risime auth_failure ip=203.0.113.9 kind=signup_refused path=/api/v1/auth/signup
#   2026-10-08T08:15:30Z risime auth_failure ip=203.0.113.9 kind=signup_rate_limited path=/api/v1/auth/signup
# The general risime-auth filter still counts these lines too.
# Test: fail2ban-regex <auth.log> <this file>
[Definition]
failregex   = ^\s*risime auth_failure ip=<HOST> kind=signup_(?:refused|rate_limited)\b
ignoreregex =
