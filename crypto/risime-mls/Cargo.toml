[package]
name = "risime-mls"
version = "0.1.0"
description = "RisiMe E2EE core: a small bytes-in/bytes-out API over OpenMLS"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
# Backups (contract v1.22 §22, decision 059): Argon2id KEK, raw DEFLATE check, NFKC passphrases.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.22"
ed25519-dalek = "2.2"
getrandom = "0.2.17"
hkdf = "0.12.4"
miniz_oxide = "0.8"
openmls = "0.9.0"
openmls_basic_credential = "0.6.0"
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2.0.21"
unicode-normalization = "0.1.24"
unicode-segmentation = "1"
zeroize = "1.9"

[dev-dependencies]
# Test-only: the vector generator's reference RFC 9180 seal (already in the tree via hpke-rs).
x25519-dalek = "2.0.1"
