[package]
name = "risime-mls"
version = "0.1.0"
description = "RisiMe E2EE core: a small bytes-in/bytes-out API over OpenMLS"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
openmls = "0.9.0"
openmls_basic_credential = "0.6.0"
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2.0.21"
